model:
  type: VISION_CLS
  name: resnet56
  params:
    num_classes: 100

training:
  criterion: CrossEntropyLoss
  optimizer: RAdam
  learning_rate: 0.002
  max_epochs: 2000
  val_every_n_epochs: 2
  log_every_n_steps: 10
  loggers:
    WandbLogger:
      params:
        name: resnet56-rniq
        note: "Symmetrical KL, no bn, bias quant"
  callbacks:
    LayersWidthVis:
      params: {}
    NoiseEarlyStopping:
      params:
        monitor: Metric/ns_Accuracy_top1
        mode: max
        patience: 50
        min_delta: 0.0001
    ModelCheckpoint:
      params:
        monitor: Metric/ns_Accuracy_top1
        mode: max
        filename: rniq_checkpoint-{epoch:02d}-"{Metric/top-1:.2f}"
    TemperatureScale:
      params:
        scale_lr: 1
        warmup: 1000
data:
  dataset_name: CIFAR100
  batch_size: 1000
  num_workers: 8


quantization:
  name: RNIQQuant
  qscheme: 1 # 0 for per-tensor, 1 for per-channel
  weight_bit: 4
  act_bit: 4
  freeze_batchnorm: False
  excluded_layers:
    - 'conv1'
    - 'linear'
  calibration:
    act_bit: 10
    weight_bit: 10
  params:
    distillation: True
    distillation_loss: Symmetrical KL
